# SRL GRPO training config — optimized for NVIDIA L4 24 GB (g2-standard-8)
# Memory budget: ~17 GB peak, leaving ~7 GB headroom
#
# Launch with:
#   python -m src.train_srl \
#     --config configs/srl_l4.yaml \
#     --lora-r 32 \
#     --lora-alpha 64 \
#     --output-dir checkpoints/srl_l4_token_8192/

model: Qwen/Qwen2.5-3B-Instruct
data: data/srl_train.jsonl
val_data: data/srl_val.jsonl
output_dir: checkpoints/srl_l4_token_8192

# Use more of s1K-1.1 — 900 train + 50 eval
max_train_samples: 500
max_eval_samples: 20

# L4 has headroom for 8 rollouts (vs 4 current)
# gradient_accumulation_steps = batch_size / per_device_batch(=1) = 8
batch_size: 8
num_generations: 8 # group_size

num_train_epochs: 1

max_new_tokens: 8192
temperature: 1.0

# reducing LR stabilizes updates with the larger effective batch
lr: 5.0e-7

clip_epsilon: 0.2
eps_std: 0.01
kl_coef: 0.01

# LoRA config — L4 24 GB has headroom for rank 32
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# Less frequent eval/save: eval takes ~1217s; don't bottleneck training
checkpoint_every: 5
eval_every: 250 # default 100
seed: 42

# Use vCPUs for async data prefetch (g2-standard-8 has 8 vCPUs)
dataloader_num_workers: 4
